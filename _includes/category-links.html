{% comment %}
  Links to the curated categories in _data/categories.yml
{% endcomment %}
{% for cat in site.data.categories %}
  {% capture cat_url %}/category/{{ cat.slug }}/{% endcapture %}
  <a class="category-link {% if page.url == cat_url %} active{% endif %}"
      href="{{ site.baseurl }}{{ cat_url }}">{{ cat.title }}</a>
{% endfor %}
