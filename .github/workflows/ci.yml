name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # External links are skipped: they're slow and flaky on PRs.
      # Some older posts link to http-only sites, so HTTPS isn't enforced.
      - name: Check links and images
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Same pinned markdownlint-cli2 as the local hook; rules from .markdownlint.json.
      - run: npm run lint:md
