title: isaac broyles | home
description: Isaac Broyles' personal site featuring articles about Software Engineering
google_analytics_ga: "G-NL6JWRCQY3"
repository: "isaacbroyles/isaacbroyles.github.io"
include: [".well-known"]
exclude: ["CLAUDE.md", "LICENSE.md", ".markdownlint.json", "Gemfile", "Gemfile.lock", "package.json", "package-lock.json", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"]
paginate: 5
url: "https://www.isaacbroyles.com"
author:
  name: Isaac Broyles
  url: https://www.isaacbroyles.com/about
  twitter: isaacbroyles
twitter:
  username: isaacbroyles
  card: summary
logo: /assets/images/isaac_broyles_bw.png
# social.links is filled from _data/social.yml by _plugins/social_links.rb.
social:
  name: Isaac Broyles
webmaster_verifications:
  google: DqeN0Z1Vx-FCZ-80zzg0NSTfxl2r1WYFY-Pj6vXW50Q
  bing: 413A3B73496AD7A36C780F6503A74820
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      image: /assets/images/Profile.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      excerpt_separator: <!--more-->
