<div class="post-meta">
  <span class="post-date">{{ include.post.date | date_to_string }}</span>
  <span class="post-categories">
    {% for category in include.post.categories %}
      &bull;

      {% assign category_data = site.data.categories | where: "slug", category | first %}
      <a href="{{ site.baseurl }}/category/{{ category | slugify }}/">
        {{ category_data.title | default: category }}
      </a>
    {% endfor %}
  </span>
</div>
