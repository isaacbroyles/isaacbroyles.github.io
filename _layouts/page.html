---
layout: default
---

<header>
  {% assign page_title = page.title %}
  {% if page.type == "category" %}
    {% assign category_data = site.data.categories | where: "slug", page.title | first %}
    {% assign page_title = category_data.title | default: page.title %}
  {% endif %}
  <h1 class="page-title">{{ page_title }}</h1>
</header>
<div class="content">
  {{ content }}
</div>
